# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Card exports up to this many rows download immediately; larger ones are generated by the
    # background worker (switched on/off on the Background worker page) and offered on the Exports page.
    app.export.sync_max_rows: 5000
    app.export.dir: '%kernel.project_dir%/var/exports'
    # Export files are deleted this long after they finish (hourly, by the worker's scheduler).
    app.export.retention: '7 days'
    # Account replacement files up to this many rows are validated (and, once approved, applied)
    # during the request; larger ones are handed to the background worker.
    app.batch.sync_max_rows: 5000
    # Accounts renamed per core transaction. Each chunk is re-validated under row locks and
    # committed on its own, so core rows are only ever locked briefly.
    app.batch.apply_chunk: 500
    # Large uploads wait here until the worker has validated them.
    app.batch.upload_dir: '%kernel.project_dir%/var/uploads'
    # Largest mapping file accepted. PHP's upload_max_filesize and post_max_size must allow it too.
    app.batch.upload_max_size: '200M'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    parameters:
        # Tiny threshold so the fixture data exercises both the immediate and the queued path.
        app.export.sync_max_rows: 2
        app.export.dir: '%kernel.project_dir%/var/exports/test'
        # Tiny thresholds so the fixture files exercise the background path and multi-chunk applies.
        app.batch.sync_max_rows: 3
        app.batch.apply_chunk: 2
        app.batch.upload_dir: '%kernel.project_dir%/var/uploads/test'
