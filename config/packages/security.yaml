security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Accounts live in the app database (app_user), managed on the User administration pages
    # (maker-checker between administrators) and with the app:user:* console commands.
    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: username

    role_hierarchy:
        # Approvers see everything officers see; BatchVoter keeps them from maker actions.
        ROLE_MIGRATION_APPROVER: [ROLE_MIGRATION_OFFICER]

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build|styles|scripts)/
            security: false
        main:
            lazy: true
            provider: app_users
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                # Always land on app_home, which picks the page by role: returning to the page that
                # asked for the sign-in would send an administrator to migration pages they cannot see.
                default_target_path: app_home
                always_use_default_target_path: true
                enable_csrf: true
            # Slows down password guessing per username and IP; accounts also lock after
            # app.security.max_failed_logins failures in a row (see LoginSubscriber).
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        # The access check runs before the logout listener, so without this rule the catch-all
        # below would refuse sign-out to every role but migration officers and approvers.
        - { path: ^/logout$, roles: PUBLIC_ACCESS }
        # Locking and unlocking the whole app with the super user's credentials (never signed in).
        - { path: ^/system-lock, roles: PUBLIC_ACCESS }
        - { path: ^/account/, roles: IS_AUTHENTICATED_FULLY }
        # The dashboard sends administrators on to user administration and checks the role itself.
        - { path: ^/$, roles: IS_AUTHENTICATED_FULLY }
        # User administrators manage accounts only; migration officers and approvers never do.
        - { path: ^/admin/, roles: ROLE_USER_ADMIN }
        - { path: ^/, roles: ROLE_MIGRATION_OFFICER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
        firewalls:
            main:
                # High enough that the tests of the account lock are not stopped by throttling first.
                login_throttling:
                    max_attempts: 50
