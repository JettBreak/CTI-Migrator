; PHP settings for the Symfony local web server (symfony serve reads this file from the project root).
; Replacement mapping files can be up to app.batch.upload_max_size (config/services.yaml), and importing
; a few hundred thousand rows takes longer than PHP's default 30 seconds. Production needs the same values
; in its own PHP configuration.
upload_max_filesize = 200M
post_max_size = 210M
max_input_time = 300
max_execution_time = 300
